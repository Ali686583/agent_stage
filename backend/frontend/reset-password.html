<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nouveau mot de passe</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .top-frame {
      width: 100%;
      padding: 10px 20px;
      background: #eaeaea;
      display: flex;
      align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .brand-logo {
      height: 40px;
      width: auto;
      display: block;
    }

    .shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
    }

    .frame-title {
      width: 320px;
      max-width: 100%;
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .auth-frame {
      width: 320px;
      max-width: 100%;
      border: 1px solid #cfcfcf;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .auth-frame label {
      font-size: 0.9rem;
      color: #333333;
      margin-bottom: 6px;
    }
    .auth-frame input {
      font: inherit;
      padding: 9px 11px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      outline: none;
      margin-bottom: 14px;
    }
    .auth-frame > *:last-child { margin-bottom: 0; }
    .auth-frame input:focus { border-color: #1B7A3E; }
    .auth-frame input::placeholder { color: #9aa0a6; }

    .btn-login {
      width: 320px;
      max-width: 100%;
      font: inherit;
      font-weight: 600;
      color: #ffffff;
      background: #6DB831;
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      cursor: pointer;
    }
    .btn-login:hover { background: #5CA028; }
    .btn-login:disabled { background: #9fbfa8; cursor: not-allowed; }

    .back-link {
      width: 320px;
      max-width: 100%;
      text-align: center;
    }
    .back-link a {
      font-size: 0.85rem;
      color: #0F6722;
      text-decoration: none;
    }
    .back-link a:hover { text-decoration: underline; }

    .auth-error {
      width: 320px;
      max-width: 100%;
      color: #c0182b;
      font-size: 0.88rem;
      text-align: center;
    }
    .auth-success {
      width: 320px;
      max-width: 100%;
      color: #0F6722;
      font-size: 0.88rem;
      text-align: center;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="top-frame">
    <div class="brand">
      <img src="logo.png" alt="OCPAgentic" class="brand-logo">
    </div>
  </div>
  <main class="shell">
    <div class="frame-title">Nouveau mot de passe</div>

    <form id="reset-frame" class="auth-frame" autocomplete="on">
      <label for="reset-pass">Nouveau mot de passe</label>
      <input id="reset-pass" type="password" autocomplete="new-password" placeholder="Au moins 8 caractères">
      <label for="reset-pass-confirm">Confirmer le mot de passe</label>
      <input id="reset-pass-confirm" type="password" autocomplete="new-password" placeholder="Ressaisissez le mot de passe">
    </form>

    <button id="btn-reset" type="button" class="btn-login">Valider le nouveau mot de passe</button>

    <p id="reset-error" class="auth-error hidden"></p>
    <p id="reset-success" class="auth-success hidden"></p>

    <div class="back-link"><a href="login.html">Retour à la connexion</a></div>
  </main>
  <script>
    const passInput = document.getElementById("reset-pass");
    const passConfirmInput = document.getElementById("reset-pass-confirm");
    const resetButton = document.getElementById("btn-reset");
    const errorBox = document.getElementById("reset-error");
    const successBox = document.getElementById("reset-success");

    function showError(message) {
      errorBox.textContent = message || "";
      errorBox.classList.toggle("hidden", !message);
    }
    function showSuccess(message) {
      successBox.textContent = message || "";
      successBox.classList.toggle("hidden", !message);
    }

    const token = new URLSearchParams(window.location.search).get("token");
    if (!token) {
      showError("Ce lien de réinitialisation est invalide.");
      resetButton.disabled = true;
    }

    resetButton.addEventListener("click", async () => {
      showError("");
      showSuccess("");
      const password = passInput.value;
      const confirmPassword = passConfirmInput.value;

      if (!password || !confirmPassword) {
        showError("Renseigne et confirme le nouveau mot de passe.");
        return;
      }
      if (password !== confirmPassword) {
        showError("Les deux mots de passe ne correspondent pas.");
        return;
      }
      if (password.length < 8) {
        showError("Le mot de passe doit contenir au moins 8 caractères.");
        return;
      }

      resetButton.disabled = true;
      let response;
      try {
        response = await fetch(`/api/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ token: token, password: password })
        });
      } catch (error) {
        resetButton.disabled = false;
        showError("Impossible de contacter le serveur.");
        return;
      }

      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) {
        resetButton.disabled = false;
        showError(data.error || "Impossible de réinitialiser le mot de passe.");
        return;
      }

      showSuccess("Mot de passe mis à jour. Tu peux maintenant te connecter.");
      passInput.value = "";
      passConfirmInput.value = "";
      setTimeout(() => { window.location.href = "login.html"; }, 2000);
    });
  </script>
</body>
</html>
