<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    /* ===== DESIGN PAGE CONNEXION — SPSAgentic ===== */

    * { box-sizing: border-box; }

    /* Fond blanc ; page en colonne pour pouvoir centrer le contenu */
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* Barre du haut */
    .top-frame {
      width: 100%;
      padding: 10px 20px;
      background: var(--color-topbar-bg);
      display: flex;
      align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .brand-logo {
      height: 40px;
      width: auto;
      display: block;
    }

    /* Bloc central : centre au milieu de l'espace restant */
    .shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
    }

    /* Titre "Connexion" au-dessus, aligne a gauche de la frame */
    .frame-title {
      width: 320px;
      max-width: 100%;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--color-text);
    }

    /* La frame (cadre) avec les champs */
    .auth-frame {
      width: 320px;
      max-width: 100%;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .auth-frame label {
      font-size: 0.9rem;
      color: var(--color-label);
      margin-bottom: 6px;
    }
    .auth-frame input {
      font: inherit;
      padding: 9px 11px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      outline: none;
      margin-bottom: 14px;
      background: var(--color-input-bg);
      color: var(--color-text);
    }
    .auth-frame > *:last-child { margin-bottom: 0; }
    .auth-frame input:focus { border-color: var(--color-accent-text); }
    .auth-frame input::placeholder { color: var(--color-placeholder); }

    /* Champ mot de passe + bouton oeil a droite */
    .pass-wrap {
      position: relative;
      margin-bottom: 0;
    }
    .pass-wrap input {
      width: 100%;
      margin-bottom: 0;
      padding-right: 40px;
    }
    .eye-btn {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      background: none;
      border: 0;
      color: var(--color-icon);
      cursor: pointer;
    }
    .eye-btn:hover { color: var(--color-icon-hover); }
    .eye-btn .eye-on { display: none; }
    .eye-btn.showing .eye-off { display: none; }
    .eye-btn.showing .eye-on { display: block; }

    /* Trait fin entre la frame et le bouton */
    .sep {
      width: 320px;
      max-width: 100%;
      height: 1px;
      background: var(--color-border-light);
      border: 0;
      margin: 6px 0 0;
    }

    /* Petit "ou" */
    .or {
      font-size: 0.85rem;
      color: var(--color-muted);
    }

    /* Bouton principal "Se connecter" */
    .btn-login {
      width: 320px;
      max-width: 100%;
      font: inherit;
      font-weight: 600;
      /* Texte fonce (pas blanc) : contraste insuffisant sur ce vert, voir
         --text-on-brand-green dans theme.css. */
      color: var(--text-on-brand-green);
      background: var(--color-accent);
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      cursor: pointer;
    }
    .btn-login:hover { background: var(--color-accent-hover); }

    /* Bouton secondaire "Creer un compte" */
    .btn-create {
      width: 320px;
      max-width: 100%;
      font: inherit;
      font-weight: 600;
      color: var(--color-accent-text);
      background: var(--color-bg);
      border: 1px solid var(--color-accent-text);
      border-radius: 6px;
      padding: 11px 14px;
      cursor: pointer;
    }
    .btn-create:hover { background: var(--color-accent-soft-bg); }

    /* Message d'erreur sous le bouton */
    .auth-error {
      width: 320px;
      max-width: 100%;
      color: var(--color-error);
      font-size: 0.88rem;
      text-align: center;
    }

    /* Lien "Mot de passe oublie ?" sous le bouton de connexion */
    .forgot-link {
      width: 320px;
      max-width: 100%;
      text-align: center;
    }
    .forgot-link a {
      font-size: 0.85rem;
      color: var(--color-accent-text);
      text-decoration: none;
    }
    .forgot-link a:hover { text-decoration: underline; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <script>window.AGENT_STAGE_TITLE_KEY = "login.title_tag";</script>
  <div class="top-frame">
    <div class="brand">
      <img src="logo.png" alt="SPSAgentic" class="brand-logo">
    </div>
    <div class="top-controls">
      <select id="lang-select" class="lang-select" aria-label="Langue / Language / اللغة">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="ar">AR</option>
      </select>
      <button id="theme-toggle" type="button" class="theme-toggle" data-i18n-aria="theme.toggle" aria-label="Mode sombre">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </div>
  <main class="shell">
    <div class="frame-title" data-i18n="login.heading">Connexion</div>
    <form id="auth-frame" class="auth-frame" autocomplete="on">
      <label for="auth-id" data-i18n="login.identifier_label">Identifiant</label>
      <input id="auth-id" type="text" autocomplete="username" data-i18n-placeholder="login.identifier_placeholder" placeholder="Saisissez votre identifiant">
      <label for="auth-pass" data-i18n="login.password_label">Mot de passe</label>
      <div class="pass-wrap">
        <input id="auth-pass" type="password" autocomplete="current-password" data-i18n-placeholder="login.password_placeholder" placeholder="Saisissez votre mot de passe">
        <button id="toggle-pass" type="button" class="eye-btn" data-i18n-aria="login.show_password" aria-label="Afficher le mot de passe">
          <svg class="eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
            <line x1="3" y1="3" x2="21" y2="21"/>
          </svg>
          <svg class="eye-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </form>

    <button id="btn-login" type="button" class="btn-login" data-i18n="login.btn_login">Se connecter</button>

    <div class="forgot-link"><a href="forgot-password.html" data-i18n="login.forgot_link">Mot de passe oublié ?</a></div>

    <hr class="sep">
    <div class="or" data-i18n="login.or">ou</div>

    <button id="btn-create" type="button" class="btn-create" data-i18n="login.btn_create">Créer un compte</button>
    <p id="auth-error" class="auth-error hidden"></p>
  </main>
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <script>
    const idInput = document.getElementById("auth-id");
    const passInput = document.getElementById("auth-pass");
    const togglePass = document.getElementById("toggle-pass");
    const createButton = document.getElementById("btn-create");
    const loginButton = document.getElementById("btn-login");
    const errorBox = document.getElementById("auth-error");

    // Oeil : masque / demasque le mot de passe. Masque => oeil barre.
    togglePass.addEventListener("click", () => {
      const estMasque = passInput.type === "password";
      passInput.type = estMasque ? "text" : "password";
      togglePass.classList.toggle("showing", estMasque);
      togglePass.setAttribute(
        "aria-label",
        AgentStageI18N.t(estMasque ? "login.hide_password" : "login.show_password")
      );
    });

    function showError(message) {
      errorBox.textContent = message || "";
      errorBox.classList.toggle("hidden", !message);
    }

    function looksLikeEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    async function goIfAlreadyConnected() {
      try {
        const response = await fetch(`/api/auth/me`, {
          credentials: "include",
        });
        const data = await response.json();
        if (response.ok && data.ok) {
          window.location.href = "page2.html";
        }
      } catch (error) {
        /* pas connecte : on reste sur la page */
      }
    }

    // Compte deja existant : on tente une connexion classique.
    loginButton.addEventListener("click", async () => {
      showError("");
      const identifiant = idInput.value.trim();
      const password = passInput.value;

      if (!identifiant || !password) {
        showError(AgentStageI18N.t("login.err_fill"));
        return;
      }

      let response;
      try {
        response = await fetch(`/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ identifier: identifiant, password: password })
        });
      } catch (error) {
        showError(AgentStageI18N.t("login.err_server"));
        return;
      }

      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) {
        showError(data.error ? AgentStageI18N.translateServerText(data.error) : AgentStageI18N.t("login.err_login_generic"));
        return;
      }
      window.location.href = "page2.html";
    });

    createButton.addEventListener("click", async () => {
      showError("");
      const identifiant = idInput.value.trim();
      const password = passInput.value;

      if (!identifiant || !password) {
        showError(AgentStageI18N.t("login.err_fill"));
        return;
      }
      // Premiere fois : l'identifiant doit obligatoirement etre un mail
      if (!looksLikeEmail(identifiant)) {
        showError(AgentStageI18N.t("login.err_email_required"));
        return;
      }

      let response;
      try {
        response = await fetch(`/api/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            username: identifiant,
            email: identifiant,
            password: password,
          })
        });
      } catch (error) {
        showError(AgentStageI18N.t("login.err_server"));
        return;
      }

      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) {
        if (response.status === 409) {
          showError(AgentStageI18N.t("login.err_exists"));
        } else {
          showError(data.error ? AgentStageI18N.translateServerText(data.error) : AgentStageI18N.t("login.err_create_generic"));
        }
        return;
      }
      window.location.href = "page2.html";
    });

    goIfAlreadyConnected();
  </script>
</body>
</html>
