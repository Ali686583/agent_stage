<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .top-frame {
      width: 100%;
      padding: 10px 20px;
      background: #6DB831;
      display: flex;
      align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .brand-logo {
      height: 40px;
      width: auto;
      display: block;
    }

    .shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
    }

    .frame-title {
      width: 320px;
      max-width: 100%;
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a1a;
    }
    .frame-subtitle {
      width: 320px;
      max-width: 100%;
      font-size: 0.88rem;
      color: #555555;
      margin-top: -8px;
    }

    .auth-frame {
      width: 320px;
      max-width: 100%;
      border: 1px solid #cfcfcf;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .auth-frame label {
      font-size: 0.9rem;
      color: #333333;
      margin-bottom: 6px;
    }
    .auth-frame input {
      font: inherit;
      padding: 9px 11px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      outline: none;
      margin-bottom: 0;
    }
    .auth-frame input:focus { border-color: #1B7A3E; }
    .auth-frame input::placeholder { color: #9aa0a6; }

    .btn-login {
      width: 320px;
      max-width: 100%;
      font: inherit;
      font-weight: 600;
      color: #ffffff;
      background: #0F6722;
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      cursor: pointer;
    }
    .btn-login:hover { background: #0d581d; }
    .btn-login:disabled { background: #9fbfa8; cursor: not-allowed; }

    .back-link {
      width: 320px;
      max-width: 100%;
      text-align: center;
    }
    .back-link a {
      font-size: 0.85rem;
      color: #0F6722;
      text-decoration: none;
    }
    .back-link a:hover { text-decoration: underline; }

    .auth-error {
      width: 320px;
      max-width: 100%;
      color: #c0182b;
      font-size: 0.88rem;
      text-align: center;
    }
    .auth-success {
      width: 320px;
      max-width: 100%;
      color: #0F6722;
      font-size: 0.88rem;
      text-align: center;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="top-frame">
    <div class="brand">
      <img src="logo.png" alt="OCPAgentic" class="brand-logo">
    </div>
  </div>
  <main class="shell">
    <div class="frame-title">Mot de passe oublié</div>
    <div class="frame-subtitle">Indique ton adresse email, on t'envoie un lien pour choisir un nouveau mot de passe.</div>

    <form id="forgot-frame" class="auth-frame" autocomplete="on">
      <label for="forgot-email">Adresse email</label>
      <input id="forgot-email" type="email" autocomplete="email" placeholder="Saisissez votre adresse email">
    </form>

    <button id="btn-send" type="button" class="btn-login">Envoyer le lien</button>

    <p id="forgot-error" class="auth-error hidden"></p>
    <p id="forgot-success" class="auth-success hidden"></p>

    <div class="back-link"><a href="login.html">Retour à la connexion</a></div>
  </main>
  <script>
    const emailInput = document.getElementById("forgot-email");
    const sendButton = document.getElementById("btn-send");
    const errorBox = document.getElementById("forgot-error");
    const successBox = document.getElementById("forgot-success");

    function showError(message) {
      errorBox.textContent = message || "";
      errorBox.classList.toggle("hidden", !message);
    }
    function showSuccess(message) {
      successBox.textContent = message || "";
      successBox.classList.toggle("hidden", !message);
    }

    sendButton.addEventListener("click", async () => {
      showError("");
      showSuccess("");
      const email = emailInput.value.trim();

      if (!email) {
        showError("Renseigne ton adresse email.");
        return;
      }

      sendButton.disabled = true;
      let response;
      try {
        response = await fetch(`/api/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email: email })
        });
      } catch (error) {
        sendButton.disabled = false;
        showError("Impossible de contacter le serveur.");
        return;
      }

      sendButton.disabled = false;
      const data = await response.json().catch(() => ({}));
      // Le serveur repond toujours par un message generique, meme si
      // l'adresse n'existe pas : on ne peut pas savoir si le compte existe.
      showSuccess(data.message || "Si un compte existe avec cette adresse, un email a ete envoye.");
      emailInput.value = "";
    });
  </script>
</body>
</html>
