<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--color-bg);
      color: var(--color-text);
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .top-frame {
      width: 100%;
      padding: 10px 20px;
      background: var(--color-topbar-bg);
      display: flex;
      align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .brand-logo {
      height: 40px;
      width: auto;
      display: block;
    }

    .shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
    }

    .frame-title {
      width: 320px;
      max-width: 100%;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--color-text);
    }
    .frame-subtitle {
      width: 320px;
      max-width: 100%;
      font-size: 0.88rem;
      color: var(--color-muted-strong);
      margin-top: -8px;
    }

    .auth-frame {
      width: 320px;
      max-width: 100%;
      border: 1px solid var(--color-border);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .auth-frame label {
      font-size: 0.9rem;
      color: var(--color-label);
      margin-bottom: 6px;
    }
    .auth-frame input {
      font: inherit;
      padding: 9px 11px;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      outline: none;
      margin-bottom: 0;
      background: var(--color-input-bg);
      color: var(--color-text);
    }
    .auth-frame input:focus { border-color: var(--color-accent-text); }
    .auth-frame input::placeholder { color: var(--color-placeholder); }

    .btn-login {
      width: 320px;
      max-width: 100%;
      font: inherit;
      font-weight: 600;
      color: #ffffff;
      background: var(--color-accent);
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      cursor: pointer;
    }
    .btn-login:hover { background: var(--color-accent-hover); }
    .btn-login:disabled { background: var(--color-disabled); cursor: not-allowed; }

    .back-link {
      width: 320px;
      max-width: 100%;
      text-align: center;
    }
    .back-link a {
      font-size: 0.85rem;
      color: var(--color-accent-text);
      text-decoration: none;
    }
    .back-link a:hover { text-decoration: underline; }

    .auth-error {
      width: 320px;
      max-width: 100%;
      color: var(--color-error);
      font-size: 0.88rem;
      text-align: center;
    }
    .auth-success {
      width: 320px;
      max-width: 100%;
      color: var(--color-accent-text);
      font-size: 0.88rem;
      text-align: center;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <script>window.AGENT_STAGE_TITLE_KEY = "forgot.title_tag";</script>
  <div class="top-frame">
    <div class="brand">
      <img src="logo.png" alt="OCPAgentic" class="brand-logo">
    </div>
    <div class="top-controls">
      <select id="lang-select" class="lang-select" aria-label="Langue / Language / اللغة">
        <option value="fr">FR</option>
        <option value="en">EN</option>
        <option value="ar">AR</option>
      </select>
      <button id="theme-toggle" type="button" class="theme-toggle" data-i18n-aria="theme.toggle" aria-label="Mode sombre">
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"/>
          <line x1="12" y1="1" x2="12" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="23"/>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
          <line x1="1" y1="12" x2="3" y2="12"/>
          <line x1="21" y1="12" x2="23" y2="12"/>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
        </svg>
      </button>
    </div>
  </div>
  <main class="shell">
    <div class="frame-title" data-i18n="forgot.heading">Mot de passe oublié</div>
    <div class="frame-subtitle" data-i18n="forgot.subtitle">Indique ton adresse email, on t'envoie un lien pour choisir un nouveau mot de passe.</div>

    <form id="forgot-frame" class="auth-frame" autocomplete="on">
      <label for="forgot-email" data-i18n="forgot.email_label">Adresse email</label>
      <input id="forgot-email" type="email" autocomplete="email" data-i18n-placeholder="forgot.email_placeholder" placeholder="Saisissez votre adresse email">
    </form>

    <button id="btn-send" type="button" class="btn-login" data-i18n="forgot.btn_send">Envoyer le lien</button>

    <p id="forgot-error" class="auth-error hidden"></p>
    <p id="forgot-success" class="auth-success hidden"></p>

    <div class="back-link"><a href="login.html" data-i18n="forgot.back_link">Retour à la connexion</a></div>
  </main>
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <script>
    const emailInput = document.getElementById("forgot-email");
    const sendButton = document.getElementById("btn-send");
    const errorBox = document.getElementById("forgot-error");
    const successBox = document.getElementById("forgot-success");

    function showError(message) {
      errorBox.textContent = message || "";
      errorBox.classList.toggle("hidden", !message);
    }
    function showSuccess(message) {
      successBox.textContent = message || "";
      successBox.classList.toggle("hidden", !message);
    }

    sendButton.addEventListener("click", async () => {
      showError("");
      showSuccess("");
      const email = emailInput.value.trim();

      if (!email) {
        showError(AgentStageI18N.t("forgot.err_email_required"));
        return;
      }

      sendButton.disabled = true;
      let response;
      try {
        response = await fetch(`/api/auth/forgot-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ email: email })
        });
      } catch (error) {
        sendButton.disabled = false;
        showError(AgentStageI18N.t("forgot.err_server"));
        return;
      }

      sendButton.disabled = false;
      // Le serveur repond toujours par le meme message generique, meme si
      // l'adresse n'existe pas : on affiche directement la version traduite
      // cote client plutot que le texte francais renvoye par l'API.
      showSuccess(AgentStageI18N.t("forgot.success_generic"));
      emailInput.value = "";
    });
  </script>
</body>
</html>
