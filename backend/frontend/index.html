<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agent_stage</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--color-bg);
      overflow: hidden;
    }

    #stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #stage img {
      max-width: 90vw;
      max-height: 90vh;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img src="animation.gif" alt="animation" id="intro-logo">
  </div>

  <script src="theme.js"></script>
  <script>
    // Le GIF lui-meme dure ~2800ms (39 frames, temps morts internes deja
    // raccourcis - voir historique git) et reste fige sur sa derniere frame
    // (scene de fin) une fois termine. Cette scene de fin reste affichee
    // 1s de plus qu'avant (jusqu'a 3800ms) avant que le fondu ne demarre ;
    // le fondu lui-meme garde sa duree d'origine (350ms), non etiree.
    const ANIMATION_DURATION_MS = 3800;
    const FADE_MS = 350;

    const img = document.getElementById("intro-logo");
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (reduced) {
      // Pas de lecture d'animation : le logo statique s'affiche brievement,
      // sans mouvement, puis redirection quasi immediate - l'acces a
      // l'application n'est jamais ralenti pour finir un effet decoratif.
      img.src = "logo.png";
      setTimeout(() => { window.location.href = "login.html"; }, 400);
    } else {
      setTimeout(() => {
        img.style.transition = `opacity ${FADE_MS}ms ease`;
        img.style.opacity = "0";
      }, ANIMATION_DURATION_MS - FADE_MS);

      setTimeout(() => {
        window.location.href = "login.html";
      }, ANIMATION_DURATION_MS);
    }
  </script>
</body>
</html>
