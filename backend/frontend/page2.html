<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agent_stage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .top-frame {
      width: 100%;
      padding: 10px 20px;
      background: #eaeaea;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .brand-logo {
      height: 40px;
      width: auto;
      display: block;
    }

    #stage {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div class="top-frame">
    <div class="brand">
      <img src="logo.png" alt="OCPAgentic" class="brand-logo">
    </div>
  </div>
  <div id="stage">
    <!-- contenu ici -->
  </div>
</body>
</html>
