<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agent_stage</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <script>window.AGENT_STAGE_TITLE_KEY = "";</script>

  <div class="workspace-shell">
    <div class="sidebar-column" id="ws-sidebar-column">
      <aside class="workspace-sidebar" id="ws-sidebar">
        <div class="sidebar-inner">
          <div class="sidebar-section" id="ws-projects-section">
            <button type="button" class="sidebar-section-header" id="ws-projects-header">
              <span class="section-chevron">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
              </span>
              <span data-i18n="workspace.projects">Projets</span>
            </button>
            <button type="button" class="sidebar-new-btn" id="ws-new-project-btn" data-i18n="workspace.new_project">+ Nouveau projet</button>
            <div class="project-create-form hidden" id="ws-project-form">
              <input type="text" id="ws-project-name-input" data-i18n-placeholder="workspace.project_name_placeholder" placeholder="Nom du projet...">
              <div class="project-create-actions">
                <button type="button" id="ws-project-cancel-btn" data-i18n="workspace.cancel">Annuler</button>
                <button type="button" class="primary" id="ws-project-create-btn" data-i18n="workspace.create">Créer</button>
              </div>
            </div>
            <div id="ws-projects-list"></div>
          </div>

          <div class="sidebar-separator"></div>

          <div class="sidebar-section open">
            <div class="sidebar-section-header" style="cursor:default;">
              <span data-i18n="workspace.discussions">Discussions</span>
            </div>
            <button type="button" class="sidebar-new-btn" id="ws-new-discussion-btn" data-i18n="workspace.new_discussion">+ Nouvelle discussion</button>
            <div class="sidebar-list" id="ws-discussions-list"></div>
          </div>
        </div>
      </aside>

      <button type="button" class="sidebar-notch" id="ws-sidebar-notch" aria-label="Fermer le menu">
        <svg class="sidebar-notch-shape" viewBox="0 0 22 46" preserveAspectRatio="none" aria-hidden="true">
          <path d="M0,4 Q0,0 4,0 L14,8 Q18,10 18,14 L18,32 Q18,36 14,38 L4,46 Q0,46 0,42 Z"/>
        </svg>
        <svg class="notch-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
          <path d="M15 18l-6-6 6-6"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-backdrop" id="ws-backdrop"></div>

    <main class="workspace-main">
      <div class="workspace-topbar">
        <div class="brand">
          <button type="button" class="mobile-sidebar-toggle" id="ws-mobile-toggle" aria-label="Menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <img src="logo.png" alt="OCPAgentic" class="brand-logo">
        </div>
        <div class="top-controls">
          <select id="lang-select" class="lang-select" aria-label="Langue / Language / اللغة">
            <option value="fr">FR</option>
            <option value="en">EN</option>
            <option value="ar">AR</option>
          </select>
          <button id="theme-toggle" type="button" class="theme-toggle" data-i18n-aria="theme.toggle" aria-label="Mode sombre">
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="5"/>
              <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
              <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
          </button>
          <div class="profile-wrap">
            <button type="button" class="profile-trigger" id="ws-profile-trigger">
              <span class="avatar" id="ws-profile-avatar">?</span>
              <span class="profile-name" id="ws-profile-name"></span>
            </button>
            <div class="profile-menu" id="ws-profile-menu">
              <div class="profile-menu-header">
                <span class="avatar avatar-lg" id="ws-profile-menu-avatar">?</span>
                <div class="profile-menu-identity">
                  <div class="profile-menu-name" id="ws-profile-menu-name"></div>
                  <div class="profile-menu-email" id="ws-profile-menu-email"></div>
                </div>
              </div>
              <button type="button" class="logout-btn" id="ws-logout-btn" data-i18n="workspace.profile_logout">Se déconnecter</button>

              <div class="more-options-row">
                <button type="button" class="more-options-btn" id="ws-more-options-btn" data-i18n="workspace.more_options">Plus d'options</button>
              </div>

              <div class="more-options-panel hidden" id="ws-more-options-panel">
                <button type="button" id="ws-opt-avatar" data-i18n="workspace.opt_avatar">Mettre une photo de profil</button>
                <button type="button" id="ws-opt-nickname" data-i18n="workspace.opt_nickname">Changer de pseudonyme</button>
              </div>

              <div class="nickname-form hidden" id="ws-nickname-form">
                <input type="text" id="ws-nickname-input" data-i18n-placeholder="workspace.nickname_placeholder" placeholder="Nouveau pseudonyme...">
                <div class="project-create-actions">
                  <button type="button" id="ws-nickname-cancel" data-i18n="workspace.cancel">Annuler</button>
                  <button type="button" class="primary" id="ws-nickname-save" data-i18n="workspace.save">Enregistrer</button>
                </div>
                <button type="button" class="link-btn danger-text" id="ws-nickname-remove" data-i18n="workspace.remove_nickname">Supprimer le pseudonyme</button>
              </div>

              <div class="delete-account-panel hidden" id="ws-delete-account-panel">
                <div class="sidebar-separator"></div>
                <button type="button" class="danger-text" id="ws-opt-delete-account" data-i18n="workspace.opt_delete_account">Supprimer le compte</button>
              </div>
            </div>
          </div>
          <input type="file" id="ws-avatar-input" class="hidden" accept="image/png,image/jpeg,image/webp">
        </div>
      </div>

      <div class="central-column" id="ws-central-column">
        <div class="conversation-area" id="ws-conversation-area"></div>

        <div class="composer-wrap">
          <div class="composer" id="ws-composer">
            <div class="drop-overlay" data-i18n="workspace.drop_here">Déposez votre document ici</div>

            <div class="model-selector">
              <button type="button" data-model="chatgpt" class="active">ChatGPT</button>
              <button type="button" data-model="claude">Claude</button>
            </div>

            <div class="file-chips" id="ws-file-chips"></div>

            <textarea id="ws-textarea" rows="1" data-i18n-placeholder="workspace.entry_placeholder" placeholder="Saisissez votre demande..."></textarea>

            <div class="composer-footer">
              <div class="composer-actions-left"></div>
              <div class="composer-actions-right">
                <input type="file" id="ws-file-input" class="hidden" multiple>
                <button type="button" class="icon-btn" id="ws-attach-btn" data-i18n-aria="workspace.attach_file" aria-label="Joindre un fichier">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <button type="button" class="send-btn model-chatgpt" id="ws-send-btn" data-i18n-aria="workspace.send" aria-label="Envoyer">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                </button>
              </div>
            </div>
          </div>

          <div class="action-widgets-row" id="ws-action-widgets"></div>
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay hidden" id="ws-modal-overlay">
    <div class="modal-box" role="alertdialog" aria-modal="true" id="ws-modal-box">
      <div class="modal-message" id="ws-modal-message"></div>
      <div class="modal-actions">
        <button type="button" class="modal-btn" id="ws-modal-cancel" data-i18n="workspace.cancel">Annuler</button>
        <button type="button" class="modal-btn danger" id="ws-modal-confirm" data-i18n="workspace.delete">Supprimer</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <script src="workspace.js"></script>
</body>
</html>
