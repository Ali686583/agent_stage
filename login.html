<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion</title>
  <style>
    /* ===== DESIGN PAGE CONNEXION — MyBusiness ===== */

    * { box-sizing: border-box; }

    /* Fond blanc ; page en colonne pour pouvoir centrer le contenu */
    body {
      margin: 0;
      min-height: 100vh;
      background: #ffffff;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    /* Barre du haut : pleine largeur, blanc casse */
    .top-frame {
      width: 100%;
      padding: 12px 20px;
      background: #eaeaea;
      display: flex;
      align-items: center;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand .logo-slot {
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      border: 1px dashed #b5b5b5;
      border-radius: 8px;
      background: #f4f4f4;
    }
    .brand .brand-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #1a1a1a;
    }
    .brand .brand-my { color: #1B7A3E; }

    /* Bloc central : centre au milieu de l'espace restant */
    .shell {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
    }

    /* Titre "Connexion" au-dessus, aligne a gauche de la frame */
    .frame-title {
      width: 320px;
      max-width: 100%;
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    /* La frame (cadre) avec les champs */
    .auth-frame {
      width: 320px;
      max-width: 100%;
      border: 1px solid #cfcfcf;
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }
    .auth-frame label {
      font-size: 0.9rem;
      color: #333333;
      margin-bottom: 6px;
    }
    .auth-frame input {
      font: inherit;
      padding: 9px 11px;
      border: 1px solid #cfcfcf;
      border-radius: 6px;
      outline: none;
      margin-bottom: 14px;
    }
    .auth-frame > *:last-child { margin-bottom: 0; }
    .auth-frame input:focus { border-color: #1B7A3E; }
    .auth-frame input::placeholder { color: #9aa0a6; }

    /* Champ mot de passe + bouton oeil a droite */
    .pass-wrap {
      position: relative;
      margin-bottom: 0;
    }
    .pass-wrap input {
      width: 100%;
      margin-bottom: 0;
      padding-right: 40px;
    }
    .eye-btn {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      background: none;
      border: 0;
      color: #777777;
      cursor: pointer;
    }
    .eye-btn:hover { color: #1a1a1a; }
    .eye-btn .eye-on { display: none; }
    .eye-btn.showing .eye-off { display: none; }
    .eye-btn.showing .eye-on { display: block; }

    /* Trait fin gris entre la frame et le bouton */
    .sep {
      width: 320px;
      max-width: 100%;
      height: 1px;
      background: #d9d9d9;
      border: 0;
      margin: 6px 0 0;
    }

    /* Petit "ou" */
    .or {
      font-size: 0.85rem;
      color: #888888;
    }

    /* Bouton principal "Se connecter" */
    .btn-login {
      width: 320px;
      max-width: 100%;
      font: inherit;
      font-weight: 600;
      color: #ffffff;
      background: #0F6722;
      border: 0;
      border-radius: 6px;
      padding: 11px 14px;
      cursor: pointer;
    }
    .btn-login:hover { background: #0d581d; }

    /* Bouton secondaire "Creer un compte" */
    .btn-create {
      width: 320px;
      max-width: 100%;
      font: inherit;
      font-weight: 600;
      color: #0F6722;
      background: #ffffff;
      border: 1px solid #0F6722;
      border-radius: 6px;
      padding: 11px 14px;
      cursor: pointer;
    }
    .btn-create:hover { background: #f0f7f1; }

    /* Message d'erreur en rouge sous le bouton */
    .auth-error {
      width: 320px;
      max-width: 100%;
      color: #c0182b;
      font-size: 0.88rem;
      text-align: center;
    }

    /* Lien "Mot de passe oublie ?" sous le bouton de connexion */
    .forgot-link {
      width: 320px;
      max-width: 100%;
      text-align: center;
    }
    .forgot-link a {
      font-size: 0.85rem;
      color: #0F6722;
      text-decoration: none;
    }
    .forgot-link a:hover { text-decoration: underline; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="top-frame">
    <div class="brand">
      <span class="logo-slot"></span>
      <span class="brand-name"><span class="brand-my">My</span>Business</span>
    </div>
  </div>
  <main class="shell">
    <div class="frame-title">Connexion</div>
    <form id="auth-frame" class="auth-frame" autocomplete="on">
      <label for="auth-id">Identifiant</label>
      <input id="auth-id" type="text" autocomplete="username" placeholder="Saisissez votre identifiant">
      <label for="auth-pass">Mot de passe</label>
      <div class="pass-wrap">
        <input id="auth-pass" type="password" autocomplete="current-password" placeholder="Saisissez votre mot de passe">
        <button id="toggle-pass" type="button" class="eye-btn" aria-label="Afficher le mot de passe">
          <svg class="eye-off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
            <line x1="3" y1="3" x2="21" y2="21"/>
          </svg>
          <svg class="eye-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </form>

    <button id="btn-login" type="button" class="btn-login">Se connecter</button>

    <div class="forgot-link"><a href="forgot-password.html">Mot de passe oublié ?</a></div>

    <hr class="sep">
    <div class="or">ou</div>

    <button id="btn-create" type="button" class="btn-create">Créer un compte</button>
    <p id="auth-error" class="auth-error hidden"></p>
  </main>
  <script src="config.js"></script>
  <script>
    const idInput = document.getElementById("auth-id");
    const passInput = document.getElementById("auth-pass");
    const togglePass = document.getElementById("toggle-pass");
    const createButton = document.getElementById("btn-create");
    const loginButton = document.getElementById("btn-login");
    const errorBox = document.getElementById("auth-error");

    // Oeil : masque / demasque le mot de passe. Masque => oeil barre.
    togglePass.addEventListener("click", () => {
      const estMasque = passInput.type === "password";
      passInput.type = estMasque ? "text" : "password";
      togglePass.classList.toggle("showing", estMasque);
      togglePass.setAttribute(
        "aria-label",
        estMasque ? "Masquer le mot de passe" : "Afficher le mot de passe"
      );
    });

    function showError(message) {
      errorBox.textContent = message || "";
      errorBox.classList.toggle("hidden", !message);
    }

    function looksLikeEmail(value) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
    }

    async function goIfAlreadyConnected() {
      try {
        const response = await fetch(`${AGENT_STAGE_API_BASE}/api/auth/me`, {
          credentials: "include",
        });
        const data = await response.json();
        if (response.ok && data.ok) {
          window.location.href = "page2.html";
        }
      } catch (error) {
        /* pas connecte : on reste sur la page */
      }
    }

    // Compte deja existant : on tente une connexion classique.
    loginButton.addEventListener("click", async () => {
      showError("");
      const identifiant = idInput.value.trim();
      const password = passInput.value;

      if (!identifiant || !password) {
        showError("Remplis l'identifiant et le mot de passe.");
        return;
      }

      let response;
      try {
        response = await fetch(`${AGENT_STAGE_API_BASE}/api/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ identifier: identifiant, password: password })
        });
      } catch (error) {
        showError("Impossible de contacter le serveur.");
        return;
      }

      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) {
        showError(data.error || "Connexion impossible.");
        return;
      }
      window.location.href = "page2.html";
    });

    createButton.addEventListener("click", async () => {
      showError("");
      const identifiant = idInput.value.trim();
      const password = passInput.value;

      if (!identifiant || !password) {
        showError("Remplis l'identifiant et le mot de passe.");
        return;
      }
      // Premiere fois : l'identifiant doit obligatoirement etre un mail
      if (!looksLikeEmail(identifiant)) {
        showError("Pour créer un compte, l'identifiant doit être une adresse mail.");
        return;
      }

      let response;
      try {
        response = await fetch(`${AGENT_STAGE_API_BASE}/api/auth/register`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            username: identifiant,
            email: identifiant,
            password: password,
          })
        });
      } catch (error) {
        showError("Impossible de contacter le serveur.");
        return;
      }

      const data = await response.json().catch(() => ({}));
      if (!response.ok || !data.ok) {
        if (response.status === 409) {
          showError("Cet identifiant ou ce mot de passe existe déjà.");
        } else {
          showError(data.error || "Création du compte impossible.");
        }
        return;
      }
      window.location.href = "page2.html";
    });

    goIfAlreadyConnected();
  </script>
</body>
</html>
