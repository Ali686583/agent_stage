<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>agent_stage</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #ffffff;
      overflow: hidden;
    }

    #stage {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #stage img {
      max-width: 90vw;
      max-height: 90vh;
    }
  </style>
</head>
<body>
  <div id="stage">
    <img src="animation.gif" alt="animation">
  </div>

  <script>
    // Durée du GIF (41 frames, ~6000ms), configuré pour ne jouer qu'une fois.
    const ANIMATION_DURATION_MS = 6000;

    setTimeout(() => {
      window.location.href = "login.html";
    }, ANIMATION_DURATION_MS);
  </script>
</body>
</html>
